                            offerDesignSubtitleTextOverride:
                              type: string
                              description: The text that will be displayed instead of the current subtitle
                                in the offer UI.
                            offerDesignId:
                              type: string
                              description: This is the offerExternalUiId, which is used to override the
                                offer UI for the store.
                            offerBackgroundImageOverride:
                              type: string
                              description: 'Image URL used to override the current background image. Appcharge
                                saves and uses this URL as-is and doesn''t download, copy, upload, or
                                host the image. The image must remain available at the provided URL.


                                We recommend uploading image files instead of using external URLs when
                                possible. Appcharge hosts uploaded files on its CDN.'
                        productSale:
                          type: object
                          description: Details on the product sale. This field is not applicable for Rolling
                            Offers. To define a product sale for Rolling Offers, refer to the 'productSale'
                            field within 'productsSequence'.
                          properties:
                            amountBeforeSale:
                              type: integer
                              description: Offer amount in USD before sale is applied.
                            sale:
                              type: integer
                              description: Sale amount in percentage.
                            type:
                              type: string
                              description: Will be 'percentage' by default. Optional values are 'percentage',
                                'multiplier', 'fixed_amount'.
                        priceDiscount:
                          type: object
                          description: Used to define the discount for the offer price. This field is
                            not applicable for Rolling Offers. To define an offer discount for Rolling
                            Offers, refer to the 'priceDiscount' field within 'productsSequence'.
                          required:
                          - discount
                          - type
                          properties:
                            priceBeforeDiscount:
                              type: integer
                              description: The original price of the offer before discount. Copied to
                                FE without any logic on Appcharge’s side. The minimum should be 0.
                              example: 100
                            discount:
                              type: integer
                              description: The discount percentage, min of 0
                              example: 20
                            type:
                              type: string
                              enum:
                              - percentage
                              description: The type of discount, currently only "percentage" is supported.
                              example: percentage
                        badges:
                          type: array
                          description: A list of badges in the offer. If you do not want to have badges,
                            then it should be sent as an empty array. This field is not applicable for
