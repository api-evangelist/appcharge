          example: /reporting/financial-data/transactions?startDate=2025-05-26T00:00:00Z&endDate=2025-07-24T23:59:59Z
    InternalServerError:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status code.
          example: 500
        error:
          type: string
          description: Error type.
          example: Internal Server Error
        message:
          type: array
          description: Array of error messages.
          items:
            type: object
            properties:
              validationErrorNumber:
                type: integer
                description: Error number.
                example: 1
              error:
                type: string
                description: Error message.
                example: Failed to get transactions.
        requestUrl:
          type: string
          description: The request URL that caused the error.
          example: /reporting/financial-data/transactions?startDate=2025-05-26T00:00:00Z&endDate=2025-07-24T23:59:59Z
    PriceOverride:
      type: object
      properties:
        countryCode2:
          type: string
          description: Country code in ISO 3166-1 alpha-2 format.
          example: BR
        price:
          type: number
          description: Override price amount. If the country's currency isn't enabled, the value is treated
            as USD and displayed in USD.
          example: 29.99
    PricePoint:
      type: object
      properties:
        priceInUsdCents:
          type: number
          description: Base price in USD cents.
          example: 999
        lastUpdate:
          type: string
          format: date-time
          description: Timestamp indicating when the price point was last updated, in UTC ISO 8601 format.
          example: '2026-01-01T14:30:00Z'
        priceByCountry:
          type: array
          items:
            $ref: '#/components/schemas/PriceByCountry'
          description: List of localized prices by country, including overrides if present.
    BadRequestErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Error message describing what went wrong.
          example: 'Invalid priceInUsdCents value: must be a positive integer [invalid1, invalid2].'
    ConflictErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Error message describing what went wrong.
          example: Cannot create new pricing. The price point already exists.
    PriceByCountry:
      type: object
      properties:
        price:
          type: number
          description: Localized price for the country.
          example: 7.99
        currencyCode:
          type: string
          description: Currency code.
          example: GBP
        isOverridden:
          type: boolean
          description: Whether the price was overridden.
          example: false
        taxModel:
          type: string
          enum:
          - Included
          - Excluded
          description: Tax model applied to the price.
          example: Included
        taxRate:
          type: number
          description: Tax rate applied to the price.
          example: 20
        country:
          type: string
          description: Country name.
          example: United Kingdom
        countryCode2:
          type: string
          description: Country code in [ISO 3166-1 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
          example: GB
        usdExchangeRateOnCalc:
          type: number
          description: USD exchange rate used at the time of calculation.
          example: 0.79
        exchangeRateDrift:
          type: string
          description: Exchange rate drift since the last calculation.
          example: -1.2%
    PricePointSummary:
      type: object
      properties:
        priceInUsdCents:
          type: number
          description: Base price in USD cents.
          example: 999
        lastUpdate:
          type: string
          format: date-time
