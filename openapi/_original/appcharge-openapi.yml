  /{YOUR_PERSONALIZE_WEBSTORE_ENDPOINT}:
    post:
      tags:
      - Personalization
      summary: Sync player information
      description: "<Note> This is a callback API. Appcharge calls this endpoint on your server when specific\
        \ events occur. </Note> \n\n Notifies your system to personalize the web store for a player. <br\
        \ /> <br /> Appcharge calls this endpoint when: <ul><li>A player logs in to your web store.</li><li>A\
        \ player completes a purchase.</li><li>Every 5 minutes after the player’s last sync.</li></ul>\
        \ Your server responds with the most current player data and all available offers for the player.\
        \ Appcharge then updates the web store for the player accordingly."
      operationId: personalize-webstore
      parameters:
      - in: header
        name: x-publisher-token
        schema:
          type: string
        description: Publisher token.
      - name: signature
        in: header
        description: The signed payload.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: string
                  description: Player ID (the same value as the `publisherPlayerId` property returned
                    in the [Authenticate Player Callback](/../../api-reference/webstore/player-authentication/authenticate-player-callback)).
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - sessionMetadata
                properties:
                  version:
                    type: integer
                    description: The used version. In this case, the value is ‘2’
                    example: 2
                  logo:
                    type: string
                    description: 'Logo ID provided when a file is uploaded to the Assets Library. Use
                      this to display a logo in your web store. '
                    example: MY_LOGO_ASSET_ID
                  status:
                    type: string
                    enum:
                    - valid
                    - invalid
                    description: Web store personalization request status.
                    example: valid
                  sessionMetadata:
                    type: object
                    description: Container for storing any pertinent information related to the player's
                      session. If enabled, this is sent back in the [Grant Award Callback](/../../api-reference/checkout/awards/grant-award-callback)
                      as well.
                  profileFrameId:
                    type: string
                    description: Corresponds to the profile frame picture ID uploaded to the asset library
                      in Appcharge's dashboard. Displayed above the player's profile picture.
                    example: profileFrame123
                  playerLevelName:
                    type: string
                    description: Aligns with the player level picture name/ID uploaded to the asset library
                      in Appcharge's dashboard. Displayed alongside the footer.
                    example: playerLevelName
                  bannerExternalId:
                    type: string
                    description: Aligns with the banner asset ID uploaded to the asset library in Appcharge’s
                      dashboard. Displayed at the top of the screen.
                    example: playerLevelAssetId
                  playerLevel:
                    type: object
                    description: Presents discounts related to the player’s level.
                    required:
                    - assetId
                    properties:
                      assetId:
                        type: string
                        description: The ID of the asset relevant to the player’s level, uploaded to the
                          asset library in Appcharge’s dashboard.
                        example: playerLevel1
                      text:
                        type: string
                        description: Text to be displayed on top of the asset.
                        example: 10%
                      endsIn:
                        type: number
                        description: Epoch timestamp in milliseconds indicating when the level discount
                          will end.
                        example: 1728283121000
                  playerLevelBanners:
                    type: array
                    description: List of banners to display to players based on their game level.
                    items:
                      type: object
                      required:
                      - assetId
                      - designId
                      properties:
                        assetId:
                          type: string
                          description: The banner ID in the Asset Library.
                        designId:
                          type: string
                          description: ID provided by Appcharge specifying the banner type and design.
                        text:
                          type: array
                          description: List of text objects for displaying the banner text.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: The text ID that specifies the text’s placement in the banner.
                              content:
                                type: string
                                description: The text displayed in the banner.
                        endsIn:
                          type: number
                          description: Unix timestamp indicating when the banner expires. For example,
                            `1720051200` represents July 4, 2024.
                  offersOrder:
                    type: string
                    enum:
                    - publisherOrder
                    - priceHighToLow
                    - priceLowToHigh
                    default: priceLowToHigh
                    description: Defines the order of offers.
                  sectionsOrder:
                    type: array
                    items:
                      type: string
                    description: An array of publisher’s section ids that defines the order of sections
                      for the store.
                  segments:
                    type: array
                    items:
                      type: string
                    description: The list of segments associated with the player.
                  focus:
                    type: object
                    properties:
                      publisherBundleId:
                        type: string
                        description: The id of the bundle to focus on in the web store.
                        example: bundle123
                    description: Customize which offer you want to focus on.
                  attributes:
                    type: object
                    description: "A set of custom key-value pairs that you can define to tag players for\
                      \ segmentation and A/B testing. These attributes can then be used to filter players\
                      \ in the Publisher Dashboard.\n\nExample:\n{\n  \"BF_test\": \"test\",\n  \"monetization_persona\"\
                      : \"non_payer\"\n}"
                  storeTheme:
                    type: object
                    description: Information about the web store theme.
                    properties:
                      bgImageMobile:
                        type: string
                        description: Name of the background image for mobile devices in the Assets Library
                          of the Publisher Dashboard.
                        example: mobile_bg_2
                      bgImageDesktop:
                        type: string
                        description: Name of the background image for desktop devices in the Assets Library
                          of the Publisher Dashboard.
                        example: desktop_bg_2
                      logo:
                        type: string
                        description: Name of the logo image in the Assets Library of the Publisher Dashboard.
                        example: store_logo_2
                      profileFrameImage:
                        type: string
                        description: Name of the profile frame image in the Assets Library of the Publisher
                          Dashboard.
                        example: profile_frame_2
                      bannerImage:
                        type: string
                        description: Name of the banner image in the Assets Library of the Publisher Dashboard.
                        example: banner_2
                      playerLevelImage:
                        type: string
                        description: Name of the player level image in the Assets Library of the Publisher
                          Dashboard.
                        example: player_level_2
                  balances:
                    type: array
                    items:
                      type: object
                      required:
                      - publisherProductId
                      - quantity
                      properties:
                        publisherProductId:
                          type: string
                          description: The publisher's product id.
                          example: product123
                        quantity:
                          type: integer
                          description: The quantity of the product. Should be greater than or equal to
                            0 and less than or equal to 24 digits long.
                          example: 5
                    description: A list of product balances of the player.
                  offers:
                    type: array
                    items:
                      type: object
                      required:
                      - publisherOfferId
                      - productsSequence
                      properties:
                        publisherOfferId:
                          type: string
