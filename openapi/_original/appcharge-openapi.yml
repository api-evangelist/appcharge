          description: "The sequence of products included in the Progress Bar offer. \n\n **Min:** 1 \n\
            \ **Max:** 50"
          items:
            type: object
            properties:
              index:
                type: integer
                description: The mission order in the Progress Bar offer. The index must start from 1
                  and be sequential.
                example: 1
              products:
                type: array
                description: "List of products rewarded when completing this mission. \n\n **Max:** 3"
                items:
                  type: object
