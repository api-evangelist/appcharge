            a `4XX` or `5XX` response.
          example: Unable to grant the award because the inventory service is unavailable.
    CheckoutSessionRequest:
      type: object
      required:
      - priceDetails
      - offer
      - customer
      properties:
        priceDetails:
          type: object
          required:
          - price
          - currency
          properties:
            price:
              type: integer
              description: Price in the smallest currency unit. For example, if the price is $10.00, pass
                `1000`, not `10.00`. For currencies with no subunit, such as JPY, the value represents
                the full unit. See [Supported Currencies](/../../merchant-of-record/finance/supported-currencies)
                for per-currency decimal rules.
              default: 1000
            currency:
              type: string
              description: Currency in ISO 4217 format.
              default: USD
        offer:
          type: object
          required:
          - name
          - sku
          properties:
            name:
              type: string
              description: Offer name. Cannot be an empty string.
              example: Treasure Chest
            sku:
              type: string
              description: Offer ID (SKU).
              example: 68452829c5e8
            displayName:
              type: string
              description: Localized offer name.
            pricePointMetadata:
              type: integer
              description: Base price of the price point in USD cents.
        items:
          type: array
          description: List of items in the offer.
          items:
            type: object
            required:
            - name
            - sku
            - quantity
            properties:
              name:
                type: string
                description: Item name.
                example: coins
              assetUrl:
                type: string
                format: uri
                description: URL of the asset (should be on a CDN).
                example: https://media-dev.appcharge.com/coin.png
              sku:
                type: string
                description: Item SKU.
                example: coins_386f9b
              quantity:
                type: integer
                description: Item quantity. Should be minimum 0 and equal to or less than 30 digits long.
                example: 3300000
              quantityDisplay:
                type: string
                description: Overrides the `quantity` value displayed in the checkout. Useful for presenting
                  time-based products or showing abbreviated values.
                example: 3.3M
              displayName:
                type: string
                description: Localized item name.
        countryCode2:
          type: string
          description: "Two-letter country code of the player in [ISO-3166 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)\
            \ format. This property is used for determining taxes in the Checkout. If not provided, Appcharge\
            \ determines the customer's country from the player's IP address. \n\n **Note:** Manually\
            \ setting a country will determine the applicable tax jurisdiction and rates. Ensure that\
            \ any country values passed via the API comply with your regulatory and business requirements."
          example: US
        customer:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              description: Unique customer identifier.
              example: 7c99fba665c4a
            email:
              type: string
              format: email
              description: Customer email address.
              example: customer@appcharge.com
            identitySignals:
              type: object
              description: Information regarding the player's identity. Pass this field to improve risk
                decisions and reduce false declines.
              properties:
                firstSeenAt:
                  type: string
                  format: date-time
                  description: First time the player was observed on your monetization platform. For example,
                    the player's account creation date in your game. Used to differentiate veteran players
                    from new accounts during risk evaluation. Must be a past date.
                  example: '2021-01-01T00:00:00Z'
        receiptMetadata:
          type: object
          description: "Metadata for the receipt. \n\n **Note:** If you want the receipt to be sent in\
            \ a specific language, first configure your translations in the Publisher Dashboard or via\
            \ the [Translations API service](/../../api-reference/translations/introduction), and then\
            \ include the desired locale here."
          properties:
            locale:
              type: string
              description: "The locale code. Both ISO-639 language code and ISO-3166 country code formats\
                \ are supported. \n\n **Note:** This value must match the language code configured in\
                \ the Publisher Dashboard, or the `locale` used in the [Set Translations API](/../../api-reference/translations/set-translations)."
              default: en
              example: fr-CA
        sessionMetadata:
          type: object
          format: json
          description: This entity serves as a versatile container for storing any pertinent information
            related to the player's session. You can add any additional data you wish to pass as a payload.
        attributes:
          type: object
          description: "A set of custom key-value pairs that you can define to tag players for segmentation\
            \ and A/B testing. These attributes can then be used to filter players in the Publisher Dashboard.\n\
            \nExample:\n{\n  \"BF_test\": \"test\",\n  \"monetization_persona\": \"non_payer\"\n}"
        redirectUrl:
          type: string
          format: uri
          description: "A deeplink URL for redirecting the player to your domain, bringing them back to\
            \ the game. For more information, see [Link Out Without SDK](/../../guides/payment-links/link-out-without-sdk).\
            \ \n\n **Note:** This property is not relevant if you're using the Payment Links SDK."
    CheckoutSessionResponse:
