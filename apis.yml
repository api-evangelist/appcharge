aid: appcharge
name: Appcharge
description: >-
  Appcharge is a monetization and payments platform (merchant of record) for mobile
  game publishers. It lets studios sell in-game offers direct-to-consumer outside the
  app stores through a hosted web store, a mobile Checkout SDK, and Payment Links —
  covering checkout sessions, price localization, coupons and promo codes, refunds,
  web-store offers (bundles, daily bonuses, rolling/special offers, progress bars,
  reward calendars, triggered popups), offer components, game-portal content, media
  assets, translations, financial and analytics reporting, and player
  personalization/authentication callbacks. The REST API authenticates with an
  x-publisher-token API-key header; webhooks and Appcharge-to-publisher callbacks are
  HMAC-SHA256 signed with a replay window; and a hosted MCP server exposes agent
  access over OAuth 2.0 (authorization_code + PKCE).
