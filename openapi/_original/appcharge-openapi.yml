                                  Only relevant when the badge sent in publisherBadgeId is from type 'Ribbon'.
                        dynamicOfferUi:
                          type: object
                          required:
                          - salePercentage
                          description: Details of the dynamic user interface for the offer. **Deprecated**
                          properties:
                            badges:
                              type: array
                              description: A list of badges in the offer.
                              items:
                                type: object
                                required:
                                - publisherBadgeId
                                - position
                                properties:
                                  publisherBadgeId:
                                    type: string
                                    description: The publisher's badge id.
                                    example: badge123
                                  position:
                                    type: string
                                    enum:
                                    - right
                                    - left
                                    - center
                                    description: This field is outdated. The position of the badge should
                                      be set from Dashboard only.
                                    example: center
                                  ribbonTextOverride:
                                    type: string
                                    description: A text that will override the ribbon's text provided
                                      in publisherBadgeId. Only relevant when the badge sent in publisherBadgeId
                                      is from type 'Ribbon'.
                            salePercentage:
                              type: integer
                              description: Sale amount in percentage.
                            amountBeforeSale:
                              type: integer
                              description: Offer amount in USD before sale is applied.
                            salePercentageDisplayType:
                              type: string
                              description: Will be 'percentage' by default. Optional values are 'percentage',
                                'multiplier', 'fixed_amount'.
                            offerDesignId:
                              type: string
                              description: This is the offerExternalUiId, which is used to override the
                                offer UI for the store.
                        productsSequence:
                          type: array
                          description: The sequence of the products included in the offer. Rolling offers
                            should be the same amount of sequences as the amount of sub offers configured
                            in the Publisher Dashboard.
                          items:
                            type: object
                            required:
                            - index
                            - products
                            properties:
                              index:
                                type: integer
                                minimum: 1
                                description: "The position of this offer or sub-offer within the parent\
                                  \ offer. Each index should be a positive integer starting from 1. \n\
                                  \n **Note:** For the Progress Bar offer, this property defines the mission\
                                  \ order."
                              productSale:
                                type: object
                                description: Details on the product sale. This field is only relevant
                                  for Rolling Offers. To define a product sale for other offer types,
                                  refer to the corresponding 'productSale' field at the root level within
                                  'offers'.
                                properties:
                                  amountBeforeSale:
                                    type: integer
                                    description: Offer amount in USD before sale is applied.
                                  sale:
                                    type: integer
                                    description: Sale amount in percentage.
                                  type:
                                    type: string
                                    description: Will be 'percentage' by default. Optional values are
                                      'percentage', 'multiplier', 'fixed_amount'.
                              priceDiscount:
                                type: object
                                description: Used to define the discount for the offer price. This is
                                  only relevant for Rolling Offers. To define a price discount for other
                                  offer types, refer to the corresponding 'priceDiscount' field at the
                                  root level within the 'offers' object.
                                required:
                                - discount
                                - type
                                properties:
                                  priceBeforeDiscount:
                                    type: integer
                                    description: The original price of the offer before discount. Copied
                                      to FE without any logic on Appcharge’s side. The minimum should
                                      be 0.
                                    example: 100
                                  discount:
                                    type: integer
                                    description: The discount percentage, min of 0
                                    example: 20
                                  type:
                                    type: string
                                    enum:
                                    - percentage
                                    description: The type of discount, currently only "percentage" is
                                      supported.
                                    example: percentage
                              badges:
                                type: array
                                description: A list of badges in the offer. If you do not want to have
                                  badges, then it should be sent as an empty array. This field is only
                                  relevant for Rolling Offers. To define badges for other offer types,
                                  refer to the 'badges' field at the root level within the 'offers' object.
                                items:
                                  type: object
                                  required:
                                  - publisherBadgeId
                                  - position
                                  properties:
                                    publisherBadgeId:
                                      type: string
                                      description: The publisher's badge id.
                                      example: badge123
                                    position:
                                      type: string
                                      enum:
                                      - right
                                      - left
                                      - center
                                      description: This field is outdated. The position of the badge should
                                        be set from Dashboard only.
                                      example: center
                                    ribbonTextOverride:
                                      type: string
                                      description: A text that will override the ribbon's text provided
                                        in publisherBadgeId. Only relevant when the badge sent in publisherBadgeId
                                        is from type 'Ribbon'.
                              progressBarPoints:
                                type: array
                                description: "The contribution of this offer toward the progress bar.\
                                  \ A points ribbon is displayed with the number of points for offers\
                                  \ that define this field. \n\n **Note:** Currently you can only have\
                                  \ 1 progress bar object."
                                items:
                                  type: object
                                  properties:
                                    publisherBarId:
                                      type: string
                                      description: The publisher's external bar ID.
                                      example: progress-bar-1
                                    points:
                                      type: integer
                                      description: Number of points awarded toward the progress bar when
                                        this offer is purchased or claimed.
                                      example: 1000
                              products:
                                type: array
                                description: "The products in a given offer. \n\n **Note:** For the Progress\
                                  \ Bar offer, this property defines the reward received when completing\
                                  \ the given mission."
                                items:
                                  type: object
                                  required:
                                  - publisherProductId
                                  - quantity
                                  properties:
                                    publisherProductId:
                                      type: string
                                      description: The product Id.
                                      example: product123
                                    quantity:
                                      type: integer
                                      description: The quantity of the product. Should be minimum 0 and
                                        equal to or less than 24 digits long.
                                      example: 2
                                    priority:
                                      type: string
                                      description: Specifies the display priority of a product within
                                        the offer.
                                      enum:
                                      - Main
                                      - Sub
                                      x-enum-descriptions:
                                      - Main: Primary display, with more prominent placement in supported
                                          templates.
                                      - Sub: Secondary display, with less prominent placement in supported
                                          templates.
                                    traits:
                                      type: array
                                      description: A list of visual or descriptive features associated
                                        with the product. Useful for distinguishing variants, bonuses,
                                        or unique characteristics of the product.
                                      items:
                                        type: object
                                        required:
                                        - assetId
                                        - text
                                        properties:
                                          assetId:
                                            type: string
                                            description: The asset ID of the trait, located in the Asset
                                              Library.
                                            example: burn_damage_icon
                                          text:
                                            type: string
                                            description: The label or descriptor associated with the trait.
                                            example: Burn Damage
                                    rarityProductInfo:
                                      type: object
                                      description: Details about the rarity of the product.
                                      properties:
                                        stars:
                                          type: integer
                                          description: The number of icons (stars) representing the rarity
                                            of the product. Displayed next to the product and inside the
                                            tooltip.
                                          example: 5
                                        tooltip:
                                          oneOf:
                                          - type: array
                                            description: Assets representing products and the player's
                                              probability of receiving them.
                                            items:
                                              type: object
                                              required:
                                              - sectionName
                                              - products
                                              properties:
                                                sectionName:
                                                  type: string
                                                  description: The section representing each product type
                                                    available in the tooltip.
                                                  example: Special Offers
                                                products:
                                                  type: array
                                                  items:
                                                    type: object
                                                    required:
                                                    - publisherProductId
                                                    - text
                                                    properties:
                                                      publisherProductId:
                                                        type: string
                                                        description: The publisher's product ID.
                                                        example: Coin
                                                      text:
                                                        type: string
                                                        description: The text associated with the product.
                                                        example: 20%
                                          - type: object
                                            description: A general description tooltip for the product.
                                            required:
                                            - tooltipText
                                            - rarityText
                                            properties:
                                              tooltipText:
                                                type: string
                                                description: The text of the tooltip.
                                                example: Rare Item
                                              rarityText:
                                                type: string
                                                description: The text that appears next to the product
                                                  and inside the tooltip, before the rarity icons (stars).
                                                example: Legendary
  /refresh-specific-active-players:
    post:
      summary: Triggers the Personalization API
      description: Triggers the [Personalize Web Store Callback](./personalize-webstore-callback) by player
        ID.
      operationId: triggerPersonalization2
      parameters:
      - in: header
        name: x-publisher-token
        schema:
          type: string
        required: true
        description: Publisher token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - playerIds
              properties:
                playerIds:
                  type: array
                  items:
                    type: string
                  description: Player IDs to trigger web store personalization.
                  example:
                  - player123
                  - player456
                  - player789
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Success message.
                    type: string
                    example: Event triggered for publisher 6422d554acc1a482bac4698e7
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message.
                    example: Schema Validation Error
                  requestUrl:
                    type: string
                    description: Request URL.
                    example: /store/v1/personalization/refresh-specific-active-players
                  body:
                    type: string
                    description: Detailed error description.
                    example: 'Property playerIds has failed the following validations: each value in playerIds
                      must be a string, playerIds must contain at least 1 elements, playerIds must be
                      an array.'
      tags:
      - General
  /refresh-active-players:
    post:
      summary: Triggers the Personalization API
      description: "Triggers the [Personalize Web Store Callback](./personalize-webstore-callback) for\
        \ all players. \n\n When refreshing data for all active players, Appcharge identifies everyone\
        \ currently browsing the web store, and updates their store view in real time."
      operationId: triggerPersonalization
      parameters:
      - in: header
        name: x-publisher-token
        schema:
          type: string
        required: true
        description: Publisher token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    description: Success message.
                    type: string
                    example: Event triggered for publisher 6422d554acc1a482bac4698e7
        '400':
          description: Bad request. Missing or invalid parameters.
        '500':
          description: Internal server error.
      tags:
      - General
  /{YOUR_AUTHENTICATE_PLAYER_ENDPOINT}:
    post:
      tags:
      - Authentication
      summary: Authenticate Player
      description: "<Note> This is a callback API. Appcharge calls this endpoint on your server when specific\
        \ events occur. </Note> \n\n Notifies your system to authenticate a player in your web store.\
        \ <br /> <br /> Appcharge calls this endpoint when a player attempts to log in to your web store\
        \ using one of the configured login methods. Your server identifies the player and responds with\
        \ either the player data or an authentication error. <br /> <br /> If the response indicates a\
        \ successful authentication, the player is logged in to the web store."
      operationId: authenticate-player
      parameters:
      - name: x-publisher-token
        in: header
        description: Publisher token.
        schema:
          type: string
      - name: signature
        in: header
        description: The signed payload.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authMethod:
                  type: string
                  description: "Authentication method the player used. \n\n **Note:** If the player logged\
                    \ in using either Pre-Authenticated Login or Game Redirect Login, Appcharge sends\
                    \ the value `otp`."
                  enum:
                  - facebook
                  - apple
                  - google
                  - userToken
                  - userPassword
                  - otp
                  example: facebook
                token:
                  type:
                  - string
                  - 'null'
                  description: Authentication token. Used for SSO Login and Player ID Login.
                  example: sdfddtt7
                date:
                  type: string
                  format: date-time
                  description: UTC time when the player tried to log in.
                  example: '2024-07-21T14:17:27.329Z'
                appId:
                  type: string
                  description: App ID in the Publisher Dashboard. Used for the SSO Login method. If no
                    app ID is available, Appcharge sends `"NA"`.
                  example: '611392880818819'
                userName:
                  type:
                  - string
                  - 'null'
                  description: Username the player entered when logging in to the web store.
                  example: expertgamer1979
                password:
                  type:
                  - string
                  - 'null'
                  description: Password the player entered when logging in to the web store.
                  example: 732hf8820pk!
                otp:
                  type:
                  - object
                  - 'null'
                  description: "Additional authentication tokens provided by your game. \n\n **Note:**\
                    \ This field is sent only if the player logged in using Pre-Authenticated Login or\
                    \ Game Redirect Login."
                  properties:
                    playerCode:
                      type: string
                      description: The 4 or 6 digit code used for verifying the player.
                      example: '974018'
                    accessToken:
                      type: string
                      description: Player access token.
                      example: 9ac888fa33412197b
                os:
                  type: string
                  enum:
                  - ios
                  - android
                  - web
                  description: Operating system the player used to log in.
                  example: android
                utmSource:
                  type: string
                  description: Source of the traffic. This is where the player came from before reaching
                    the store.
                  example: Facebook
                utmMedium:
                  type: string
                  description: Marketing channel used to bring in the traffic.
                  example: email
                utmCampaign:
                  type: string
                  description: Marketing campaign identifier associated with the traffic.
                  example: spring_sale.
                sessionId:
                  type: string
                  description: Session ID.
                  example: 2e55b3fc-31ef-6dd7-8161-8aeb376b3a23
                playerLocation:
                  type: object
                  description: Location of the player.
                  properties:
                    countryCode2:
                      type: string
                      description: 'Two-letter country code in [ISO-3166 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
                        format. Example: `US`'
                      example: US
                    state:
                      type: string
                      description: 'Two-letter state code. Example: `NY`'
                      example: NY
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - publisherPlayerId
                - playerName
                properties:
                  status:
                    type: string
                    description: The status of the player authentication. If you pass a value other than
                      `valid`, the API fails.
                    enum:
                    - valid
                    example: valid
                  playerProfileImage:
                    type: string
                    description: Player profile image. If no image is available, an empty string must
                      be provided. In this case, a default image is displayed.
                    example: https://scontent-iad4-1.xx.fbcdn.net/v/t6.30597-1/84628273_176159830277856_972693363922829312_n.jpg?stp=c379.0.1290.1290a_cp0_dst-jpg_s50x50_tt6&ccb=1-7
                  publisherPlayerId:
                    type: string
                    description: Player ID.
                    example: vip2247691
                  playerName:
                    type: string
                    description: Player name.
                    example: Jim Cardashian
                  sessionMetadata:
                    type: object
                    description: An object for passing data related to the player's session. It is returned
                      in the [Grant Award Callback](/../../api-reference/checkout/awards/grant-award-callback),
                      and if enabled, the [Personalization API](/../../api-reference/webstore/personalization/introduction).
                    example:
                      abTest: group1
                      locale: en-US
                  publisherErrorMessageType:
                    type: string
                    enum:
                    - none
                    - plainText
                    - enrichedText
                    description: "Error message type. Supported values: \n + `none`: No error message\
                      \ is provided. \n + `plainText`: A basic error message in plain text. \n + `enrichedText`:\
                      \ A formatted error message in MD format that may contain additional styling or\
                      \ elements."
                    example: plainText
                  publisherErrorMessage:
                    type: string
                    description: Error message.
                    example: Lost internet connection.
                  publisherErrorMessageTitle:
                    type: string
                    description: Error message title displayed to players when a login attempt fails.
                    example: Whoops! Login Failed.
                  playerOverrideCountry:
                    type: string
                    description: Overrides the player's detected location for pricing purposes. Use when
                      the player's country of origin differs from their detected country. Must be a two-letter
                      country code in [ISO-3166 alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
                      format.
                    example: CA
  /{YOUR_INITIATE_GAME_AUTH_ENDPOINT}:
    post:
      tags:
      - Authentication
      summary: Initiate Game Auth
      description: <Warning> This API endpoint is only relevant for the Game Redirect Login method. </Warning>
        <Note> This is a callback API. Appcharge calls this endpoint on your server when specific events
        occur. </Note> Notifies your system to initiate an authentication session in your game. <br />
        <br /> Appcharge calls this endpoint when a player attempts to log in via [Game Redirect Login](/../../guides/webstore/player-authentication/game-redirect-login/about-game-redirect-login).
        Your server responds with either the data needed to redirect the player to your game for authentication,
        or an error.
      operationId: game-authentication-endpoint
      parameters:
      - name: x-publisher-token
        in: header
        description: Publisher token.
        schema:
          type: string
      - name: signature
        in: header
        description: The signed payload.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  enum:
                  - DESKTOP
                  - APPCHARGE
                  description: "Device the player used to log in. \n \n  + `DESKTOP`: PCs and laptops.\
                    \ \n + `APPCHARGE`: Mobile."
                  example: DESKTOP
                date:
                  type: string
                  format: date-time
                  description: Date in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format.
                  example: '2023-11-07T05:31:56Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - deepLink
                - accessToken
                properties:
                  deepLink:
                    type: string
                    description: Deeplink for redirecting the player to your game for authentication.
                    example: https://my-awesome-game/2298/bv45d674?key=549bc5151667f6216629efe46vf7bacd2812d82298
                  accessToken:
                    type: string
                    description: Player access token.
                    example: 9ac8883227afa33412197b
                  desktopAutoRedirect:
                    type: boolean
                    default: false
                    description: 'Whether players logging into the web store on desktop are redirected
                      to the deepLink URL instead of being shown a QR code.


                      When `false` or omitted, these players see a QR code of the deeplink and must scan
                      it with their phone to open the game.'
                    example: true
        '400':
          description: Invalid signature
        '401':
          description: Unauthorized
        '403':
          description: Parameters not correct
components:
  schemas:
    PlayerOrderReportRequest:
      type: object
      properties:
        orderId:
          type: string
          description: Order ID in the Publisher Dashboard.
          example: 68e25eebdcb1278
        purchaseId:
          type: string
          description: Purchase ID.
          example: pr_750b85591e1643685718e5443xyz789
        appChargePaymentId:
          type: string
          description: Payment ID.
          example: 68e25eebd76543210
        purchaseDateAndTimeUtc:
          type: string
          format: date-time
