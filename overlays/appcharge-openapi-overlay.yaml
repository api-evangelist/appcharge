overlay: 1.0.0
info:
  title: API Evangelist enhancements for Appcharge API
  version: 1.0.0
extends: openapi/appcharge-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 4
      x-apievangelist-enriched: '2026-07-18'
      x-apievangelist-notes: >-
        Appcharge monetization platform for mobile games (D2C web store, Checkout
        SDK, Payment Links). REST auth is the x-publisher-token API-key header;
        webhooks/callbacks are HMAC-SHA256 signed; the hosted MCP server is OAuth2
        (PKCE). See authentication/, conventions/, errors/, lifecycle/, sandbox/.
  - target: $.info
    update:
      x-apievangelist-artifacts:
        authentication: authentication/appcharge-authentication.yml
        conventions: conventions/appcharge-conventions.yml
        errors: errors/appcharge-problem-types.yml
        lifecycle: lifecycle/appcharge-lifecycle.yml
        rate_limits: rate-limits/appcharge-rate-limits.yml
        sandbox: sandbox/appcharge-sandbox.yml
        data_model: data-model/appcharge-data-model.yml
        events: asyncapi/appcharge-events-asyncapi.yml
        mcp: mcp/appcharge-mcp.yml
  - target: $.info
    update:
      x-apievangelist-security-model:
        rest: apiKey (x-publisher-token, header)
        webhooks: hmac-sha256 (signature header, ~5m replay window)
        mcp: oauth2 authorizationCode + PKCE (S256)
        mtls: supported for server-to-server
