    CreateRewardCalendarOfferDto:
      type: object
      required:
      - publisherOfferId
      - name
      - type
      - subType
      - active
      - priority
      - productsSequence
      - rewardCalendar
      properties:
        publisherOfferId:
          type: string
          description: Reward Calendar offer ID provided by the publisher. This is the offer's **External
            ID** value in the Publisher Dashboard.
          example: reward-calendar-1
        name:
          type: string
          description: Reward Calendar offer name.
          example: Weekly Reward Calendar
        type:
          type: string
          description: Offer type. For Reward Calendars, use `PopUp`.
          enum:
          - PopUp
          example: PopUp
        subType:
          type: string
          description: Popup offer subtype. For Reward Calendars, use `RewardCalendar`.
          enum:
          - RewardCalendar
          example: RewardCalendar
        active:
          type: boolean
          description: Whether the Reward Calendar offer is active.
          example: true
        priority:
          type: integer
          description: Display priority for eligible popup offers. Lower numbers appear first.
          minimum: 1
          example: 1
        offerUiId:
          type: string
          description: Internal ID of the Reward Calendar offer design. Required if `offerExternalUiId`
            is not provided.
